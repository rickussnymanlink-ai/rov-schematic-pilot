<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MODULE 7 — TRACE IT</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  --cyan: #00e5ff;
  --amber: #ffb300;
  --red: #ff1744;
  --green: #00e676;
  --purple: #e040fb;
  --teal: #00bfa5;
  --bg: #050d1a;
  --bg2: #0a1628;
  --bg3: #0d1f3c;
  --border: rgba(0,229,255,0.18);
  --text: #c8e0f0;
  --dim: rgba(200,224,240,0.45);

  /* Signal colours */
  --sig-110vac: #ff6b35;
  --sig-24vdc: #ffb300;
  --sig-rs232: #00e676;
  --sig-rs485: #00e5ff;
  --sig-fibre: #e040fb;
  --sig-hydraulic: #ff4081;
  --sig-earth: #8bc34a;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Exo 2', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HEADER ── */
.m7-header {
  background: linear-gradient(135deg, var(--bg3) 0%, var(--bg2) 100%);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px 10px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.m7-header h1 {
  font-family: 'Orbitron', monospace;
  font-size: 13px;
  letter-spacing: 3px;
  color: var(--cyan);
  text-shadow: 0 0 16px var(--cyan);
}
.m7-header p {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--dim);
  margin-top: 3px;
}

/* ── SIGNAL LEGEND ── */
.sig-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 10px 16px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
}
.sig-pill {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px;
  padding: 3px 8px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(0,0,0,0.3);
}
.sig-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ── COMPONENT SELECTOR ── */
.selector-section {
  padding: 14px 16px;
}
.selector-section h2 {
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--amber);
  margin-bottom: 10px;
}
.comp-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
.comp-btn {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: left;
  position: relative;
  overflow: hidden;
}
.comp-btn::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--accent-col, var(--cyan));
}
.comp-btn.active {
  border-color: var(--accent-col, var(--cyan));
  background: rgba(0,229,255,0.07);
  box-shadow: 0 0 16px rgba(0,229,255,0.15);
}
.comp-btn .cb-label {
  font-family: 'Orbitron', monospace;
  font-size: 9px;
  letter-spacing: 1px;
  color: var(--accent-col, var(--cyan));
  display: block;
  margin-bottom: 3px;
}
.comp-btn .cb-desc {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px;
  color: var(--dim);
}

/* ── TRACE DIAGRAM ── */
.trace-section {
  padding: 0 16px 14px;
}
.trace-section h2 {
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--cyan);
  margin-bottom: 10px;
  padding-top: 4px;
}

.trace-placeholder {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 30px 16px;
  text-align: center;
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  color: var(--dim);
}

/* ── SVG TRACE CANVAS ── */
.trace-canvas-wrap {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  position: relative;
}
.trace-canvas-wrap svg {
  width: 100%;
  display: block;
}

/* Node boxes */
.node-box {
  fill: var(--bg3);
  stroke: var(--border-col, rgba(0,229,255,0.3));
  stroke-width: 1;
  rx: 6;
  cursor: pointer;
  transition: fill 0.2s;
}
.node-box:hover { fill: rgba(0,229,255,0.08); }
.node-box.active { stroke: var(--cyan); stroke-width: 2; fill: rgba(0,229,255,0.12); }
.node-box.fault { stroke: var(--red); fill: rgba(255,23,68,0.12); }
.node-box.downstream-fault { stroke: var(--red); fill: rgba(255,23,68,0.07); opacity: 0.7; }

.node-label {
  font-family: 'Orbitron', monospace;
  font-size: 7px;
  fill: var(--cyan);
  text-anchor: middle;
}
.node-sublabel {
  font-family: 'Share Tech Mono', monospace;
  font-size: 6px;
  fill: rgba(200,224,240,0.6);
  text-anchor: middle;
}

/* Animated wire paths */
.wire-path {
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.wire-path.animated {
  stroke-dasharray: 8 4;
  animation: wire-flow 1s linear infinite;
}
.wire-path.fault-path {
  stroke: var(--red) !important;
  stroke-dasharray: 6 3;
  animation: wire-fault 0.6s linear infinite;
  opacity: 0.5;
}
@keyframes wire-flow {
  to { stroke-dashoffset: -12; }
}
@keyframes wire-fault {
  0% { stroke-dashoffset: 0; opacity: 0.5; }
  50% { opacity: 0.2; }
  100% { stroke-dashoffset: -9; opacity: 0.5; }
}

/* Connector tap points */
.conn-tap {
  cursor: pointer;
  transition: r 0.15s;
}
.conn-tap circle {
  fill: var(--bg2);
  stroke-width: 2;
  transition: all 0.2s;
}
.conn-tap:hover circle { r: 9; }
.conn-tap.fault-point circle { fill: rgba(255,23,68,0.3); stroke: var(--red) !important; }

/* Fault injector marker */
.fault-marker {
  fill: var(--red);
  font-size: 10px;
  text-anchor: middle;
  dominant-baseline: central;
  pointer-events: none;
}

/* ── POPUP ── */
.node-popup {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--bg3);
  border-top: 2px solid var(--cyan);
  border-radius: 16px 16px 0 0;
  padding: 16px;
  z-index: 200;
  transform: translateY(100%);
  transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
  max-height: 65vh;
  overflow-y: auto;
}
.node-popup.open { transform: translateY(0); }
.popup-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 12px;
}
.popup-title {
  font-family: 'Orbitron', monospace;
  font-size: 12px;
  color: var(--cyan);
  letter-spacing: 1.5px;
}
.popup-subtitle {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--amber);
  margin-top: 3px;
}
.popup-close {
  background: rgba(255,23,68,0.15);
  border: 1px solid var(--red);
  color: var(--red);
  border-radius: 6px;
  padding: 4px 10px;
  font-family: 'Orbitron', monospace;
  font-size: 9px;
  cursor: pointer;
  flex-shrink: 0;
}
.popup-section {
  margin-bottom: 12px;
}
.popup-section-title {
  font-family: 'Orbitron', monospace;
  font-size: 9px;
  letter-spacing: 1px;
  color: var(--amber);
  margin-bottom: 6px;
  padding-bottom: 4px;
  border-bottom: 1px solid rgba(255,179,0,0.2);
}
.pin-table {
  width: 100%;
  border-collapse: collapse;
}
.pin-table tr { border-bottom: 1px solid rgba(0,229,255,0.07); }
.pin-table td {
  padding: 4px 6px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
}
.pin-table td:first-child {
  color: var(--cyan);
  width: 28px;
  font-weight: bold;
}
.pin-table td:last-child { color: var(--dim); }
.pin-nc { color: rgba(200,224,240,0.25) !important; }

.info-row {
  display: flex;
  gap: 8px;
  margin-bottom: 5px;
}
.info-badge {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px;
  padding: 3px 8px;
  border-radius: 4px;
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.08);
}
.info-badge.cyan { border-color: var(--cyan); color: var(--cyan); }
.info-badge.amber { border-color: var(--amber); color: var(--amber); }
.info-badge.green { border-color: var(--green); color: var(--green); }
.info-badge.red { border-color: var(--red); color: var(--red); }

.fault-btn {
  width: 100%;
  margin-top: 8px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--red);
  background: rgba(255,23,68,0.08);
  color: var(--red);
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.2s;
}
.fault-btn:hover { background: rgba(255,23,68,0.18); }
.fault-btn.active {
  background: rgba(255,23,68,0.25);
  box-shadow: 0 0 16px rgba(255,23,68,0.3);
}
.clear-fault-btn {
  width: 100%;
  margin-top: 6px;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid var(--green);
  background: rgba(0,230,118,0.06);
  color: var(--green);
  font-family: 'Orbitron', monospace;
  font-size: 9px;
  cursor: pointer;
}

/* ── FAULT STATUS BAR ── */
.fault-bar {
  display: none;
  background: rgba(255,23,68,0.12);
  border: 1px solid rgba(255,23,68,0.4);
  border-radius: 8px;
  margin: 0 16px 10px;
  padding: 8px 12px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--red);
}
.fault-bar.visible { display: flex; align-items: center; gap: 8px; }
.fault-bar-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--red);
  animation: pulse-red 0.8s ease-in-out infinite alternate;
  flex-shrink: 0;
}
@keyframes pulse-red {
  from { box-shadow: 0 0 4px var(--red); }
  to { box-shadow: 0 0 14px var(--red); }
}

/* ── OVERLAY ── */
.popup-overlay {
  position: fixed;
  inset: 0;
  background: rgba(5,13,26,0.6);
  z-index: 190;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.popup-overlay.visible { opacity: 1; pointer-events: all; }

/* ── CONTROLS ── */
.controls-bar {
  display: flex;
  gap: 8px;
  padding: 0 16px 12px;
  flex-wrap: wrap;
}
.ctrl-btn {
  flex: 1;
  min-width: 120px;
  padding: 9px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--cyan);
  font-family: 'Orbitron', monospace;
  font-size: 9px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}
.ctrl-btn:hover { border-color: var(--cyan); background: rgba(0,229,255,0.06); }
.ctrl-btn.red-btn { color: var(--red); border-color: rgba(255,23,68,0.3); }
.ctrl-btn.red-btn:hover { border-color: var(--red); background: rgba(255,23,68,0.08); }

/* ── OPEN PORTS TABLE ── */
.ports-section {
  padding: 0 16px 20px;
}
.ports-section h2 {
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--amber);
  margin-bottom: 10px;
}
.port-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border-radius: 6px;
  margin-bottom: 4px;
  background: var(--bg2);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: border-color 0.15s;
}
.port-row:hover { border-color: rgba(0,229,255,0.4); }
.port-num {
  font-family: 'Orbitron', monospace;
  font-size: 9px;
  color: var(--cyan);
  min-width: 24px;
}
.port-name {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  flex: 1;
}
.port-type {
  font-family: 'Share Tech Mono', monospace;
  font-size: 8px;
  padding: 2px 6px;
  border-radius: 4px;
}
.port-type.used { background: rgba(0,230,118,0.12); color: var(--green); }
.port-type.spare { background: rgba(255,179,0,0.1); color: var(--amber); }
.port-type.optional { background: rgba(224,64,251,0.1); color: var(--purple); }
.port-sig {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="m7-header">
  <h1>MODULE 7 — TRACE IT</h1>
  <p>SMD QUASAR · Q CORE POD · AH2136 · AH2742 · Interactive Flow Path Trainer</p>
</div>

<!-- SIGNAL LEGEND -->
<div class="sig-legend">
  <div class="sig-pill"><div class="sig-dot" style="background:#ff6b35"></div>110VAC</div>
  <div class="sig-pill"><div class="sig-dot" style="background:#ffb300"></div>24VDC</div>
  <div class="sig-pill"><div class="sig-dot" style="background:#00e676"></div>RS232</div>
  <div class="sig-pill"><div class="sig-dot" style="background:#00e5ff"></div>RS485</div>
  <div class="sig-pill"><div class="sig-dot" style="background:#e040fb"></div>FIBRE</div>
  <div class="sig-pill"><div class="sig-dot" style="background:#ff4081"></div>HYD</div>
  <div class="sig-pill"><div class="sig-dot" style="background:#8bc34a"></div>EARTH</div>
</div>

<!-- COMPONENT SELECTOR -->
<div class="selector-section">
  <h2>SELECT TRACE PATH</h2>
  <div class="comp-grid">
    <button class="comp-btn active" style="--accent-col:#ff6b35" onclick="selectTrace('lights14')" id="btn-lights14">
      <span class="cb-label">LIGHTS 1–4</span>
      <span class="cb-desc">110VAC · Lamp Dimmer</span>
    </button>
    <button class="comp-btn" style="--accent-col:#ff6b35" onclick="selectTrace('lights512')" id="btn-lights512">
      <span class="cb-label">LIGHTS 5–12 + HID</span>
      <span class="cb-desc">110VAC · K2 Relay</span>
    </button>
    <button class="comp-btn" style="--accent-col:#ffb300" onclick="selectTrace('cameras')" id="btn-cameras">
      <span class="cb-label">CAMERAS 1–6</span>
      <span class="cb-desc">24VDC · RS485 · Video</span>
    </button>
    <button class="comp-btn" style="--accent-col:#ffb300" onclick="selectTrace('hdcams')" id="btn-hdcams">
      <span class="cb-label">HD CAM 7 & 8</span>
      <span class="cb-desc">24VDC · RS232 · SDI</span>
    </button>
    <button class="comp-btn" style="--accent-col:#00e676" onclick="selectTrace('sonar')" id="btn-sonar">
      <span class="cb-label">SONAR</span>
      <span class="cb-desc">RS232 · 24VDC · AF5729</span>
    </button>
    <button class="comp-btn" style="--accent-col:#00e676" onclick="selectTrace('dvl')" id="btn-dvl">
      <span class="cb-label">DVL</span>
      <span class="cb-desc">RS232 · 24VDC · Port 11</span>
    </button>
    <button class="comp-btn" style="--accent-col:#ff4081" onclick="selectTrace('thrusters')" id="btn-thrusters">
      <span class="cb-label">THRUSTERS</span>
      <span class="cb-desc">RS485 · iTCU · Hydraulic</span>
    </button>
    <button class="comp-btn" style="--accent-col:#00e5ff" onclick="selectTrace('pantilt')" id="btn-pantilt">
      <span class="cb-label">PAN & TILT</span>
      <span class="cb-desc">RS485 · AE0024 · Ports 17/18</span>
    </button>
    <button class="comp-btn" style="--accent-col:#ffb300" onclick="selectTrace('altimeter')" id="btn-altimeter">
      <span class="cb-label">ALTIMETER</span>
      <span class="cb-desc">0–10VDC · Slot 14 AI</span>
    </button>
    <button class="comp-btn" style="--accent-col:#00e5ff" onclick="selectTrace('responder')" id="btn-responder">
      <span class="cb-label">RESPONDER</span>
      <span class="cb-desc">Trigger · Port 19</span>
    </button>
    <button class="comp-btn" style="--accent-col:#ffb300" onclick="selectTrace('cpprobe')" id="btn-cpprobe">
      <span class="cb-label">CP PROBE</span>
      <span class="cb-desc">Analogue · Port 27</span>
    </button>
    <button class="comp-btn" style="--accent-col:#e040fb" onclick="showPortsMap()" id="btn-ports">
      <span class="cb-label">OPEN PORTS</span>
      <span class="cb-desc">All 31 ports · status map</span>
    </button>
  </div>
</div>

<!-- FAULT STATUS BAR -->
<div class="fault-bar" id="faultBar">
  <div class="fault-bar-dot"></div>
  <span id="faultBarText">FAULT INJECTED — downstream signal lost</span>
</div>

<!-- CONTROLS -->
<div class="controls-bar">
  <button class="ctrl-btn red-btn" onclick="clearAllFaults()">⚡ CLEAR ALL FAULTS</button>
  <button class="ctrl-btn" onclick="showInfo()">ℹ HOW TO USE</button>
</div>

<!-- TRACE DIAGRAM -->
<div class="trace-section">
  <h2 id="traceTitleBar">TRACE: LIGHTS 1–4 + LAMP DIMMER</h2>
  <div class="trace-canvas-wrap" id="traceCanvasWrap">
    <!-- SVG injected by JS -->
  </div>
</div>

<!-- OPEN PORTS MAP (hidden by default) -->
<div class="ports-section" id="portsSection" style="display:none">
  <h2>ALL 31 PORTS — NODE 1 SUBSEA POD</h2>
  <div id="portsTableContainer"></div>
</div>

<!-- POPUP OVERLAY -->
<div class="popup-overlay" id="popupOverlay" onclick="closePopup()"></div>

<!-- NODE POPUP -->
<div class="node-popup" id="nodePopup">
  <div class="popup-header">
    <div>
      <div class="popup-title" id="popupTitle">NODE DETAILS</div>
      <div class="popup-subtitle" id="popupSubtitle"></div>
    </div>
    <button class="popup-close" onclick="closePopup()">✕ CLOSE</button>
  </div>
  <div id="popupBody"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════
let currentTrace = 'lights14';
let activeFaults = {};   // nodeId → true
let activeNodeId = null;
let showingPorts = false;

// ══════════════════════════════════════════════════════════════
// TRACE DEFINITIONS
// Each trace: title, nodes[], wires[], faultGroups[]
// Nodes: id, label, sub, x, y, w, h, color, data{}
// Wires: from, to, color, label
// faultGroups: array of nodeIds downstream of each wire segment
// ══════════════════════════════════════════════════════════════
const TRACES = {

  lights14: {
    title: 'TRACE: LIGHTS 1–4 + LAMP DIMMER',
    viewBox: '0 0 380 520',
    nodes: [
      { id:'lv_pdu', label:'LV PDU', sub:'TOPSIDE · AH2645', x:140, y:10, w:100, h:34, color:'#ff6b35',
        data:{ type:'Power Source', drawing:'AH2645', signal:'440VAC 3-phase → TX7 → 110VAC',
          pins:[], info:'Ship 440V incoming through SW1 changeover. TX7 steps to 110VAC for pod supply.' }},
      { id:'umbilical', label:'UMBILICAL', sub:'AB7224 · 300m+', x:140, y:68, w:100, h:34, color:'#ff6b35',
        data:{ type:'Cable', drawing:'AG8200', signal:'110VAC L1/L2', cable:'AB7224 300m+',
          pins:[{n:'L1',s:'110VAC(L) Line'},{n:'L2',s:'110VAC(N) Neutral'},{n:'ECM',s:'0.5mm² RED earth continuity'}],
          info:'HV umbilical carries 110VAC subsea via L1/L2 conductors.' }},
      { id:'uet', label:'UET', sub:'UMBILICAL ELEC TERM', x:130, y:126, w:120, h:34, color:'#ff6b35',
        data:{ type:'Termination Box', drawing:'AH2136 Sht2', signal:'110VAC',
          info:'Umbilical electrical termination. Earth connection on chassis. Main vehicle earth point. Earth front/rear plates. 4mm stainless wire with heatshrink for earth bonding.',
          pins:[] }},
      { id:'aa5699', label:'TRANSFORMER', sub:'AA5699 · TMS STATIC JB', x:130, y:184, w:120, h:34, color:'#ff6b35',
        data:{ type:'Transformer', drawing:'AH2478', signal:'110VAC 15kVA + 18VAC 500VA + 3000VAC',
          info:'AA5699 inside TMS Static JB. Outputs: 110VAC 15kVA for pod systems, 18VAC 500VA, 3000VAC HV.',
          pins:[{n:'Pri',s:'3000VAC HV from umbilical'},{n:'Sec1',s:'110VAC 15kVA'},{n:'Sec2',s:'18VAC 500VA'},{n:'J4-1',s:'110VAC L1/L2 Lamps 1-2'},{n:'J4-2',s:'110VAC L3/L4 Lamps 3-4'}] }},
      { id:'port25', label:'PORT 25', sub:'POD POWER · 20-PIN', x:130, y:242, w:120, h:34, color:'#ff6b35',

// ══════════════════════════════════════════════════════════════
// SVG RENDERER
// ══════════════════════════════════════════════════════════════
function renderTrace(traceKey) {
  const T = TRACES[traceKey];
  if (!T) return;

  const [vx, vy, vw, vh] = T.viewBox.split(' ').map(Number);
  const W = vw, H = vh;

  // Build node map for wire routing
  const nodeMap = {};
  T.nodes.forEach(n => { nodeMap[n.id] = n; });

  // Get center of node
  const cx = n => n.x + n.w/2;
  const cy = n => n.y + n.h/2;
  const bot = n => n.y + n.h;
  const top = n => n.y;

  let svgContent = `<svg viewBox="${T.viewBox}" xmlns="http://www.w3.org/2000/svg" style="min-height:${H * (380/W)}px">
  <defs>
    <filter id="glow-cyan"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-red"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>`;

  // Draw wires first (behind nodes)
  T.wires.forEach(w => {
    const fn = nodeMap[w.from], tn = nodeMap[w.to];
    if (!fn || !tn) return;

    const isFault = activeFaults[w.from] || activeFaults[w.to];
    const isDownFault = Object.keys(activeFaults).some(fid => {
      const ds = T.downstream[fid] || [];
      return ds.includes(w.from) || ds.includes(w.to);
    });

    const strokeCol = isFault ? '#ff1744' : (isDownFault ? '#ff1744' : w.color);
    const anim = isFault ? 'wire-fault' : 'wire-flow';
    const dashOpacity = isDownFault && !isFault ? 0.3 : 1;

    // Simple vertical/stepped routing
    const x1 = cx(fn), y1 = bot(fn);
    const x2 = cx(tn), y2 = top(tn);
    const mid = (y1 + y2) / 2;

    let path;
    if (Math.abs(x1 - x2) < 5) {
      path = `M${x1},${y1} L${x2},${y2}`;
    } else {
      path = `M${x1},${y1} L${x1},${mid} L${x2},${mid} L${x2},${y2}`;
    }

    svgContent += `<path d="${path}" class="wire-path animated" 
      style="stroke:${strokeCol};animation-name:${anim};opacity:${dashOpacity}" />`;

    // Wire label
    if (w.label) {
      const lx = (x1 + x2) / 2, ly = mid - 3;
      svgContent += `<text x="${lx}" y="${ly}" 
        font-family="'Share Tech Mono'" font-size="5.5" fill="${strokeCol}" text-anchor="middle" opacity="0.8">${w.label}</text>`;
    }
  });

  // Draw nodes
  T.nodes.forEach(n => {
    const isFault = !!activeFaults[n.id];
    const isDownstream = !isFault && Object.keys(activeFaults).some(fid => {
      const ds = T.downstream[fid] || [];
      return ds.includes(n.id);
    });

    const borderCol = isFault ? '#ff1744' : (isDownstream ? '#ff1744' : (n.color || '#00e5ff'));
    const fillCol = isFault ? 'rgba(255,23,68,0.15)' : (isDownstream ? 'rgba(255,23,68,0.06)' : '#0d1f3c');
    const textCol = isFault ? '#ff1744' : (isDownstream ? 'rgba(255,23,68,0.7)' : (n.color || '#00e5ff'));
    const nodeOpacity = isDownstream ? 0.6 : 1;

    svgContent += `
    <g onclick="tapNode('${n.id}')" style="cursor:pointer;opacity:${nodeOpacity}">
      <rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="5" 
        fill="${fillCol}" stroke="${borderCol}" stroke-width="${isFault?2:1}" />
      ${isFault ? `<text x="${n.x + n.w - 10}" y="${n.y + 12}" font-size="10" fill="#ff1744" text-anchor="middle">⚡</text>` : ''}
      <text x="${cx(n)}" y="${n.y + 13}" font-family="Orbitron" font-size="7" fill="${textCol}" text-anchor="middle" font-weight="600">${n.label}</text>
      <text x="${cx(n)}" y="${n.y + 24}" font-family="'Share Tech Mono'" font-size="5.5" fill="rgba(200,224,240,0.55)" text-anchor="middle">${n.sub}</text>
    </g>`;
  });

  svgContent += `</svg>`;
  document.getElementById('traceCanvasWrap').innerHTML = svgContent;
}

// SELECT TRACE
// ══════════════════════════════════════════════════════════════
function selectTrace(key) {
  currentTrace = key;
  activeFaults = {};
  showingPorts = false;

  // Update buttons
  document.querySelectorAll('.comp-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('btn-' + key);
  if (btn) btn.classList.add('active');

  const T = TRACES[key];
  if (T) {
    document.getElementById('traceTitleBar').textContent = T.title;
    document.getElementById('traceCanvasWrap').style.display = '';
    document.getElementById('portsSection').style.display = 'none';
    document.getElementById('faultBar').classList.remove('visible');
    renderTrace(key);
  }
}

// ══════════════════════════════════════════════════════════════
// TAP NODE → SHOW POPUP
// ══════════════════════════════════════════════════════════════
function tapNode(nodeId) {
  const T = TRACES[currentTrace];
  if (!T) return;
  const node = T.nodes.find(n => n.id === nodeId);
  if (!node) return;
  activeNodeId = nodeId;

  const d = node.data || {};
  document.getElementById('popupTitle').textContent = node.label;
  document.getElementById('popupSubtitle').textContent = node.sub + (d.type ? ' · ' + d.type : '');

  let html = '';

  // Info row
  html += `<div class="info-row">`;
  if (d.drawing) html += `<span class="info-badge amber">📐 ${d.drawing}</span>`;
  if (d.signal) html += `<span class="info-badge cyan">⚡ ${d.signal}</span>`;
  if (d.cable) html += `<span class="info-badge green">🔌 ${d.cable}</span>`;
  if (d.connector) html += `<span class="info-badge">${d.connector}</span>`;
  html += `</div>`;

  // Description
  if (d.info) {
    html += `<div class="popup-section">
      <div class="popup-section-title">DESCRIPTION</div>
      <div style="font-family:'Share Tech Mono';font-size:11px;color:var(--dim);line-height:1.5">${d.info}</div>
    </div>`;
  }

  // Pin table
  if (d.pins && d.pins.length > 0) {
    html += `<div class="popup-section">
      <div class="popup-section-title">PIN-OUT</div>
      <table class="pin-table">`;
    d.pins.forEach(p => {
      const nc = p.s === 'N/C' || p.s.startsWith('N/C');
      html += `<tr><td>${p.n}</td><td class="${nc?'pin-nc':''}">${p.s}</td></tr>`;
    });
    html += `</table></div>`;
  }

  // Downstream info
  const ds = T.downstream[nodeId] || [];
  if (ds.length > 0) {
    html += `<div class="popup-section">
      <div class="popup-section-title">DOWNSTREAM NODES (${ds.length})</div>
      <div style="font-family:'Share Tech Mono';font-size:10px;color:var(--dim)">${ds.join(' → ')}</div>
    </div>`;
  }

  // Fault buttons
  const isFault = !!activeFaults[nodeId];
  html += `<button class="fault-btn ${isFault?'active':''}" onclick="toggleFault('${nodeId}')">
    ${isFault ? '⚡ FAULT ACTIVE — TAP TO CLEAR' : '⚡ INJECT FAULT HERE'}
  </button>`;
  if (Object.keys(activeFaults).length > 0) {
    html += `<button class="clear-fault-btn" onclick="clearAllFaults();closePopup()">CLEAR ALL FAULTS</button>`;
  }

  document.getElementById('popupBody').innerHTML = html;
  document.getElementById('nodePopup').classList.add('open');
  document.getElementById('popupOverlay').classList.add('visible');
}

function closePopup() {
  document.getElementById('nodePopup').classList.remove('open');
  document.getElementById('popupOverlay').classList.remove('visible');
}

// ══════════════════════════════════════════════════════════════
// FAULT INJECTOR
// ══════════════════════════════════════════════════════════════
function toggleFault(nodeId) {
  if (activeFaults[nodeId]) {
    delete activeFaults[nodeId];
  } else {
    activeFaults[nodeId] = true;
  }
  updateFaultBar();
  closePopup();
  renderTrace(currentTrace);
}

function clearAllFaults() {
  activeFaults = {};
  updateFaultBar();
  renderTrace(currentTrace);
}

function updateFaultBar() {
  const bar = document.getElementById('faultBar');
  const keys = Object.keys(activeFaults);
  if (keys.length === 0) {
    bar.classList.remove('visible');
  } else {
    bar.classList.add('visible');
    const T = TRACES[currentTrace];
    let affected = new Set();
    keys.forEach(fid => {
      const ds = (T && T.downstream[fid]) || [];
      ds.forEach(d => affected.add(d));
    });
    document.getElementById('faultBarText').textContent =
      `FAULT @ ${keys.join(', ')} — ${affected.size} downstream node(s) affected`;
  }
}

      <div class="port-sig" style="background:${p.color}"></div>
      <div class="port-num">${p.n}</div>
      <div class="port-name">${p.name}</div>
      <div style="font-family:'Share Tech Mono';font-size:8px;color:var(--dim);flex:1;text-align:right;margin-right:6px">${p.sig}</div>
      <div class="port-type ${p.status}">${p.status.toUpperCase()}</div>
    </div>`;
  });

  document.getElementById('portsTableContainer').innerHTML = html;
  document.getElementById('portsSection').style.display = 'block';
}

function showPortDetail(portNum) {
  const p = PORTS_MAP.find(x => x.n === portNum);
  if (!p) return;
  document.getElementById('popupTitle').textContent = `PORT ${p.n} — ${p.name}`;
  document.getElementById('popupSubtitle').textContent = p.sig + ' · ' + p.status.toUpperCase();
  document.getElementById('popupBody').innerHTML = `
    <div class="info-row">
      <span class="info-badge amber">📐 ${p.draw}</span>
      <span class="info-badge" style="border-color:${p.color};color:${p.color}">⚡ ${p.sig}</span>
    </div>
    <div style="margin-top:10px;font-family:'Share Tech Mono';font-size:11px;color:var(--dim)">
      Status: <span style="color:${p.status==='used'?'var(--green)':p.status==='spare'?'var(--amber)':'var(--purple)'}">${p.status.toUpperCase()}</span><br><br>
      Tap any trace button above to see the full wiring path for this port.
    </div>`;
  document.getElementById('nodePopup').classList.add('open');
  document.getElementById('popupOverlay').classList.add('visible');
}
